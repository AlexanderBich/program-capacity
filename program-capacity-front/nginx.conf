server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # text/event-stream is deliberately absent: compressing a stream would buffer it.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same origin as the app, so the httpOnly refresh cookie stays first-party.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Availability is a long-lived stream: never buffer it, and outlast its heartbeat.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # add_header in a location discards the server's, which is why each of these includes the set.
  location /assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
