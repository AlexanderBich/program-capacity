# The whole stack: backend, its infrastructure, the treasury simulator and the frontend.
# Run from this folder: docker compose up --build, then open http://localhost:8080
name: program-capacity

include:
  - program-capacity-back/docker-compose.yml

services:
  front:
    build:
      context: program-capacity-front
      args:
        VITE_API_URL: /api/v1
        VITE_SHOW_DEMO_ACCOUNTS: "true"
        VITE_DEMO_PASSWORD: capacity-demo-password
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
