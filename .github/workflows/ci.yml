name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program-capacity-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: program-capacity-back/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Fails below the thresholds in jest.config.js.
      - run: npm run test:cov
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: program-capacity-back/coverage

  backend-integration:
    name: Backend integration tests (real PostgreSQL and Kafka)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program-capacity-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: program-capacity-back/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  frontend:
    name: Frontend tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: program-capacity-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: program-capacity-front/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Fails below the thresholds in vite.config.ts.
      - run: npm run test:cov
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: program-capacity-front/coverage

  e2e:
    name: End-to-end scenarios (whole stack, real browser)
    needs: [backend, backend-integration, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run stack:up
      - run: npm test
      - name: Show what the services said
        if: failure()
        run: docker compose -p program-capacity-e2e -f ../docker-compose.yml logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
